name: OfflineMaps
options:
  bundleIdPrefix: com.example
targets:
  OfflineMaps:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: "Show your location on the map"
