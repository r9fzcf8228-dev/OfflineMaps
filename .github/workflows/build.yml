name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project OfflineMaps.xcodeproj -scheme OfflineMaps -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - run: mkdir Payload && cp -r build/Build/Products/Release-iphoneos/OfflineMaps.app Payload/ && zip -r OfflineMaps.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineMaps-ipa
          path: OfflineMaps.ipa
